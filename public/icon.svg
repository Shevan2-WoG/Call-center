<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1580" />
      <stop offset="50%" stop-color="#240c54" />
      <stop offset="100%" stop-color="#120329" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c28f5" />
      <stop offset="100%" stop-color="#ff2a85" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88d600" />
      <stop offset="100%" stop-color="#a3f700" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Central Emblem Container -->
  <circle cx="256" cy="240" r="140" fill="#1b0840" stroke="#6c28f5" stroke-width="8" filter="url(#shadow)" />

  <!-- Phone Handset -->
  <g transform="translate(160, 144) scale(0.39)" filter="url(#shadow)">
    <path fill="url(#accentGrad)" d="M497.39 361.8l-112-48a24 24 0 0 0-28 6.9l-49.6 60.6A370.66 370.66 0 0 1 130.6 204.6L191.2 155a24 24 0 0 0 6.9-28l-48-112A24.16 24.16 0 0 0 122.6.61l-104 24A24 24 0 0 0 0 48c0 256.5 207.9 464 464 464a24 24 0 0 0 23.4-18.6l24-104a24.29 24.29 0 0 0-14.01-27.6z"/>
  </g>

  <!-- Signal / Audio Broadcast Waves -->
  <path d="M 330 180 A 60 60 0 0 1 330 250" fill="none" stroke="#88d600" stroke-width="12" stroke-linecap="round" />
  <path d="M 360 155 A 100 100 0 0 1 360 275" fill="none" stroke="#ff2a85" stroke-width="12" stroke-linecap="round" />

  <!-- KIU Badge / Label -->
  <g transform="translate(256, 420)">
    <rect x="-90" y="-30" width="180" height="44" rx="22" fill="#6c28f5" stroke="#88d600" stroke-width="3" />
    <text x="0" y="1" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="3">KIU HUB</text>
  </g>
</svg>
